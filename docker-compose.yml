# Production-like stack. Configuration comes from the shell or a local .env file
# (docker compose reads it automatically); nothing secret is written here.
services:
  app:
    build: .
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-login_parking}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      DB_SSL: "false"
      JWT_KEY: ${JWT_KEY:?Set JWT_KEY (at least 32 characters)}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      APP_TIMEZONE: ${APP_TIMEZONE:-America/Bogota}
      REPORTS_ENABLED: ${REPORTS_ENABLED:-false}
      MAIL_TRANSPORT: ${MAIL_TRANSPORT:-rabbitmq}
      MAIL_API_URL: ${MAIL_API_URL:-}
      MAIL_API_KEY: ${MAIL_API_KEY:-}
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://rabbitmq}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:-}
      R2_BUCKET_ACCESS_KEY: ${R2_BUCKET_ACCESS_KEY:-}
      R2_BUCKET_SECRET_KEY: ${R2_BUCKET_SECRET_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-login_parking}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
