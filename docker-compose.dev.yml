# Runs the whole test suite (unit + e2e) against a throwaway PostgreSQL:
#   docker compose -f docker-compose.dev.yml up --build --abort-on-container-exit
# Only local test values; no .env file is needed.
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: ["npm", "run", "test:all"]
    environment:
      TEST_DB_HOST: postgres
      TEST_DB_PORT: 5432
      TEST_DB_USER: postgres
      TEST_DB_PASSWORD: postgres
      TEST_DB_NAME: login_parking_test
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
